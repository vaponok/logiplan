name: Сборка

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Тесты и проверка типов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  windows:
    name: Windows exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Сборка (exe + установщик)
        run: npx tauri build
      - name: Размеры
        shell: pwsh
        run: |
          $files = @(Get-Item src-tauri/target/release/logiplan.exe) + @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe)
          "| Файл | Размер |" >> $env:GITHUB_STEP_SUMMARY
          "|---|---|" >> $env:GITHUB_STEP_SUMMARY
          foreach ($f in $files) { "| $($f.Name) | $([math]::Round($f.Length / 1MB, 2)) МБ |" >> $env:GITHUB_STEP_SUMMARY }
      - uses: actions/upload-artifact@v4
        with:
          name: logiplan-windows
          path: |
            src-tauri/target/release/logiplan.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Релиз (только для тегов v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/logiplan.exe
            src-tauri/target/release/bundle/nsis/*.exe
