[package]
name = "logiplan"
version = "0.1.0"
description = "Combined Foxhole Tools"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# Без dynamic-acl: права только из capabilities/, добавлять их на лету
# программе не нужно (−130 КБ exe). x11 и dbus — только для Linux.
tauri = { version = "2.12", default-features = false, features = ["wry", "compression", "common-controls-v6", "x11", "dbus"] }
tauri-plugin-store = "2.5"
tauri-plugin-window-state = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Заглушка вместо таблиц Unicode для доменов на любых алфавитах (−125 КБ exe):
# программа открывает только свои адреса tauri.localhost / ipc.localhost.
idna_adapter = "=1.0.0"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

# Размер exe: оптимизация под размер, LTO, без отладочных символов.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
